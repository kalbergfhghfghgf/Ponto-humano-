name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair zip
        run: |
          mkdir -p /tmp/proj
          for z in *.zip; do unzip -q -o "$z" -d /tmp/proj; done
          S=$(find /tmp/proj -name settings.gradle.kts | head -1)
          test -n "$S" || { echo "NAO ACHEI settings.gradle.kts"; exit 1; }
          echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        run: gradle assembleDebug --no-daemon -p "$PROJ"

      - name: Copiar APK
        run: |
          mkdir -p out
          find /tmp/proj -name app-debug.apk -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ToqueFacil-apk
          path: out/app-debug.apk
